<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>游戏 - 潮汕升级</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0d5e36 0%, #0a4a2a 100%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .info-bar {
      display: flex;
      justify-content: space-around;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      align-items: center;
    }
    .mode-badge {
      background: rgba(255,215,0,0.3);
      color: #ffd700;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
    }
    .level, .trump, .score {
      color: #ffd700;
      font-size: 14px;
      font-weight: bold;
    }
    .opponents {
      flex: 1;
      position: relative;
    }
    .player {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .player.top { top: 10px; left: 50%; transform: translateX(-50%); }
    .player.left { left: 10px; top: 50%; transform: translateY(-50%); }
    .player.right { right: 10px; top: 50%; transform: translateY(-50%); }
    .avatar {
      width: 50px; height: 50px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .name { color: #fff; font-size: 12px; margin-top: 4px; }
    .card-count { color: #aaa; font-size: 10px; }
    .play-area {
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .played-card {
      width: 60px; height: 84px;
      background: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #333;
    }
    .hand {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px;
      gap: 6px;
    }
    .card {
      width: 50px; height: 70px;
      background: #fff;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #333;
      border: 2px solid #ccc;
      cursor: pointer;
      user-select: none;
    }
    .card.selected {
      border-color: #ffd700;
      transform: translateY(-10px);
    }
    .actions {
      display: flex;
      justify-content: center;
      padding: 10px;
      gap: 10px;
    }
    .btn {
      padding: 10px 30px;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      color: white;
      cursor: pointer;
    }
    .btn-play { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .btn-pass { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .btn-bid { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    .status {
      text-align: center;
      color: #ffd700;
      font-size: 14px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="info-bar">
      <div class="mode-badge" id="modeBadge">⚡ 快速</div>
      <div class="level">打 <span id="trumpRank">2</span></div>
      <div class="trump">主牌: <span id="trumpSuit">无</span></div>
      <div class="score">我方 0 : 0 对方</div>
    </div>

    <div class="opponents">
      <div class="player top">
        <div class="avatar" id="avatar2">🤖</div>
        <div class="name" id="name2">AI小红</div>
        <div class="card-count" id="count2">25张</div>
      </div>
      <div class="player left">
        <div class="avatar" id="avatar1">🤖</div>
        <div class="name" id="name1">AI小明</div>
        <div class="card-count" id="count1">25张</div>
      </div>
      <div class="player right">
        <div class="avatar" id="avatar3">🤖</div>
        <div class="name" id="name3">AI小刚</div>
        <div class="card-count" id="count3">25张</div>
      </div>
    </div>

    <div class="play-area" id="playArea"></div>

    <div class="hand" id="hand"></div>

    <div class="actions">
      <button class="btn btn-play" id="playBtn" onclick="playCards()" style="display:none;">出牌</button>
      <button class="btn btn-pass" id="passBtn" onclick="pass()" style="display:none;">过</button>
      <button class="btn btn-bid" id="bidBtn" onclick="bid()" style="display:none;">叫主</button>
    </div>

    <div class="status" id="statusText">准备开始...</div>
  </div>

  <script src="gameLogic.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode') || 'quick';
    
    let game;
    let selectedCards = [];
    
    function initGame() {
      document.getElementById('modeBadge').textContent = mode === 'room' ? '🏠 房间' : '⚡ 快速';
      
      if (mode === 'room') {
        const gameData = JSON.parse(localStorage.getItem('currentGame') || '{}');
        initRoomGame(gameData);
      } else {
        initQuickGame();
      }
    }
    
    function initRoomGame(gameData) {
      game = new Game();
      
      if (gameData.players) {
        game.players = gameData.players.map(p => ({
          id: p.id,
          name: p.name,
          avatar: p.avatar || '😀',
          hand: [],
          team: p.team,
          isAI: p.isAI,
          ready: true
        }));
        
        // 更新显示
        game.players.forEach((p, i) => {
          if (i === 0) return; // 跳过自己
          const el = document.getElementById(`name${i}`);
          if (el) el.textContent = p.name;
          const av = document.getElementById(`avatar${i}`);
          if (av) av.textContent = p.avatar;
        });
      }
      
      game.trumpRank = gameData.trumpRank || '2';
      game.deal();
      
      document.getElementById('trumpRank').textContent = game.trumpRank;
      renderHand();
      updateCounts();
      
      document.getElementById('statusText').textContent = '请选择一张级牌叫主';
      document.getElementById('bidBtn').style.display = 'inline-block';
    }
    
    function initQuickGame() {
      game = new Game();
      game.deal();
      
      document.getElementById('trumpRank').textContent = game.trumpRank;
      renderHand();
      updateCounts();
      
      document.getElementById('statusText').textContent = '请选择一张级牌叫主';
      document.getElementById('bidBtn').style.display = 'inline-block';
    }
    
    function renderHand() {
      const container = document.getElementById('hand');
      container.innerHTML = game.players[0].hand.map((card, i) => 
        `<div class="card ${selectedCards.includes(i) ? 'selected' : ''}" onclick="selectCard(${i})" data-index="${i}">${card.toString()}</div>`
      ).join('');
    }
    
    function selectCard(index) {
      const idx = selectedCards.indexOf(index);
      if (idx > -1) {
        selectedCards.splice(idx, 1);
      } else {
        selectedCards.push(index);
      }
      renderHand();
      checkCanPlay();
    }
    
    function checkCanPlay() {
      const hasSelection = selectedCards.length > 0;
      document.getElementById('playBtn').style.display = hasSelection ? 'inline-block' : 'none';
    }
    
    function bid() {
      if (selectedCards.length !== 1) {
        alert('请选择一张级牌');
        return;
      }
      
      const card = game.players[0].hand[selectedCards[0]];
      if (card.rank !== game.trumpRank) {
        alert('请选择级牌（当前为' + game.trumpRank + '）');
        return;
      }
      
      game.bid(0, card);
      document.getElementById('trumpSuit').textContent = getSuitName(game.trumpSuit);
      selectedCards = [];
      renderHand();
      updateCounts();
      
      document.getElementById('statusText').textContent = '你是庄家，请出牌';
      document.getElementById('bidBtn').style.display = 'none';
      document.getElementById('playBtn').style.display = 'inline-block';
    }
    
    function playCards() {
      if (selectedCards.length === 0) return;
      
      const cards = selectedCards.map(i => game.players[0].hand[i]);
      
      if (game.playCards(0, cards)) {
        renderPlayArea(cards);
        selectedCards = [];
        renderHand();
        updateCounts();
        
        document.getElementById('statusText').textContent = '等待其他玩家出牌';
        document.getElementById('playBtn').style.display = 'none';
        
        // AI出牌
        setTimeout(aiTurn, 1000);
      } else {
        alert('出牌无效');
      }
    }
    
    function aiTurn() {
      if (game.phase !== 'PLAY' || !game.players[game.currentPlayer].isAI) return;
      
      const aiCards = game.aiPlay(game.currentPlayer);
      if (aiCards) {
        game.playCards(game.currentPlayer, aiCards);
        renderPlayArea(aiCards);
        updateCounts();
        
        if (game.players[game.currentPlayer].isAI) {
          setTimeout(aiTurn, 1000);
        } else {
          document.getElementById('statusText').textContent = '请出牌';
          document.getElementById('playBtn').style.display = 'inline-block';
        }
      }
    }
    
    function renderPlayArea(cards) {
      const container = document.getElementById('playArea');
      container.innerHTML = cards.map(c => `<div class="played-card">${c.toString()}</div>`).join('');
    }
    
    function updateCounts() {
      game.players.forEach((p, i) => {
        if (i === 0) return;
        const el = document.getElementById(`count${i}`);
        if (el) el.textContent = p.hand.length + '张';
      });
    }
    
    function pass() {
      alert('过');
    }
    
    function getSuitName(suit) {
      const map = { 'spade': '♠黑桃', 'heart': '♥红桃', 'club': '♣梅花', 'diamond': '♦方块' };
      return map[suit] || suit;
    }
    
    initGame();
  </script>
</body>
</html>
